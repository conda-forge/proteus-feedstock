{% set name = "proteus" %}
{% set version = "1.8.3" %}
{% set build = 21 %}
{% set sha256 = "315f0600044e2ad86592c248a9a4ca87dc58c1d678af2c27a9ddde802b555618" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: proteus-{{ version }}.tar.gz
  url: https://github.com/erdc/proteus/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    # v1.8.3's setup.py hard-codes -mavx (x86-only) for MeshSmoothing and
    # cMoveMeshMonitor, which fails outright on any non-x86 target ("error:
    # unrecognized command-line option '-mavx'" on linux-aarch64;
    # "unsupported option '-mavx' for target arm64-apple-darwin..." on
    # osx-arm64). Fixed upstream after this release (erdc/proteus commit
    # 13d526b1) but not yet in a new tag. conda-build's arm64/aarch64
    # selectors are OS-specific names for the same architecture (osx uses
    # "arm64", linux uses "aarch64"), so both are needed here.
    - fix-arm64-avx.patch  # [(osx and arm64) or (linux and aarch64)]
    # xtensor 0.27.1 reorganized its headers into subdirectories by
    # category -- xio.hpp -> io/xio.hpp, xarray.hpp -> containers/
    # xarray.hpp, xview.hpp -> views/xview.hpp, xfixed.hpp -> containers/
    # xfixed.hpp (confirmed against the actual 0.27.1 source tree; all
    # four old paths 404). Only matters on linux-aarch64, where the
    # recipe's own xtensor pin above is relaxed to >=0.27.1 (no older
    # xtensor-python builds exist for that platform at all) -- every
    # other platform stays on the old xtensor pin and doesn't need this.
    # Patches every proteus header that includes any of these four
    # (ArgumentsDict.h, RANS2P.h, RANS2P2D.h) -- confirmed exhaustive via
    # a full grep of the source tree for xtensor/* includes.
    - fix-linux-aarch64-xio-path.patch  # [linux and aarch64]
    # The newer xtensor/xtl required on linux-aarch64 (see above) uses
    # both std::conjunction (C++17) and C++20 `concept` syntax
    # unconditionally in its headers -- but every extension that calls
    # get_xtensor_include() (exactly the 35 that hard-code -std=c++14)
    # fails with "'conjunction' is not a member of 'std'" and then, once
    # bumped only to C++17, "'concept' does not name a type". Bump those
    # 35 '-std=c++14' occurrences straight to '-std=c++20' instead.
    # Scoped to linux-aarch64 only, same as the two patches above.
    - fix-linux-aarch64-cxx20.patch  # [linux and aarch64]

build:
  number: {{ build }}
  skip: true  # [win]
  # scorec has no openmpi build on osx-arm64 (openmpi's mpicc/mpicxx are
  # real compiled binaries that can't execute under cross-compilation from
  # an osx-64 build host, unlike mpich's portable shell-script wrappers --
  # see scorec-feedstock recipe). Since proteus unconditionally requires
  # both scorec and {{ mpi }}, the openmpi variant can never solve here.
  skip: true  # [osx and arm64 and mpi == "openmpi"]
  {% set mpi_prefix = "mpi_" + mpi %}
  string: {{ mpi_prefix }}_h{{ PKG_HASH }}_{{ build }}
  run_exports:
    - {{ name }} * {{ mpi_prefix }}_*

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - make
    # Needed for cross-compiled builds (osx-arm64 built from an osx-64
    # host): without a build-platform python + cross-python's sysconfig
    # shim, there is no usable "python"/"$PYTHON" to run setup.py at all
    # -- $PREFIX/bin/python is a real arm64 binary that can't execute on
    # the x86_64 build machine ("Bad CPU type in executable"). See
    # h5py-feedstock's recipe for the same pattern.
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3                             # [build_platform != target_platform]
    - numpy >=1.25.1                         # [build_platform != target_platform]
  host:
    - setuptools
    - cython >=3
    - pybind11
    - pip
    - metis
    - {{ mpi }}
    - numpy >=1.25.1
    # Unpinned "openblas" lets the solver satisfy it with the ancient
    # 0.3.4 ABI-compatibility-shim build conda-forge keeps around for its
    # generic libblas/liblapack dispatch layer -- that build doesn't
    # actually use the libgfortran5 run_exports pulls in, so anything
    # linking it (proteus's superluWrappers extension, in particular)
    # fails at import time with "libgfortran.so.3: cannot open shared
    # object file" since only libgfortran.so.5 is provided. A lower
    # bound is enough to keep the solver on a real, current build.
    - openblas >=0.3.20
    - parmetis
    - petsc4py
    - petsc
    # real_*, not complex_*: proteus's C++ is built with -DPETSC_SKIP_COMPLEX
    # and assumes real PETSC_SCALAR throughout. Without this filter the
    # solver is free to pick either scalar variant. Kept as a separate entry
    # (like hdf5's mpi_prefix filter below) rather than replacing the bare
    # "petsc" line above, since conda-build's variant-based version pinning
    # (from conda_build_config.yaml) is only applied to a literal bare
    # package name in the recipe text.
    #
    # petsc4py itself has no equivalent "real_*"/"complex_*" build string
    # (its own recipe.yaml has no `build.string` override, just a generic
    # hash) -- it's already correctly filtered indirectly, since its own
    # host requirement is `petsc ${version_xy}.* ${scalar}_*`, so once
    # petsc itself is pinned to real_* here, any petsc4py built against
    # complex petsc becomes unsatisfiable on its own.
    - petsc * real_*
    - python
    # Upper bound: scorec >=3 renamed/restructured its core PCU parallel-
    # communication API to take an explicit PCU_t handle on every call
    # (previously global, zero-argument functions) -- see SCOREC/core PR
    # #433 ("pcu-object-breaking"). proteus's MeshAdaptPUMI C++ glue code
    # calls the old global-style API directly across ~150 sites in 7
    # files and hasn't been ported yet. Without this pin the solver is
    # free to float proteus onto an incompatible scorec build as soon as
    # one lands on conda-forge (see conda-forge/scorec-feedstock#27).
    - scorec >=2.2.8,<3
    - triangle
    - superlu
    - superlu_dist
    - pychrono >=9,<10
    - mpi4py
    # include-paths changed in 0.25. linux-aarch64 only ever had
    # xtensor-python 0.29.0 built (no older builds exist for that platform
    # at all), which pulls in xtensor >=0.27.1 -- unsatisfiable against the
    # <0.26 pin below, so relax it there specifically rather than for
    # every platform. proteus's only xtensor usage is xt::pyarray<T> as a
    # plain function-parameter type in ADR.h (xtensor-python/pyarray.hpp),
    # which is unchanged in 0.29.0, so this is expected to compile fine.
    - xtensor <0.26  # [not (linux and aarch64)]
    - xtensor >=0.27.1,<0.28.0a0  # [linux and aarch64]
    - xtensor-python
    - eigen
    # pinning from conda_build_config and build pinning from {{ mpi_prefix }}
    - hdf5
    - hdf5 * {{ mpi_prefix }}_*
  run:
    - mpi4py
    - scipy
    - tetgen
    - triangle
    - ncurses
    - pychrono >=9,<10
    - scorec >=2.2.8,<3
    - python 3
    - {{ pin_compatible('openblas', max_pin='x.x') }}
    - {{ pin_compatible('petsc4py', max_pin='x.x') }}
    - {{ pin_compatible('cython', max_pin='x.x') }}
    # pinning from conda_build_config and build pinning from {{ mpi_prefix }}
    - hdf5
    - hdf5 * {{ mpi_prefix }}_*
    - h5py
    - h5py * {{ mpi_prefix }}_*
test:
  imports:
    - proteus
  source_files:
    - test
  requires:
    - pytest
    - pytest-forked
    - matplotlib-base
  commands:
    - pytest -v test/ci/test_meshPartitionFromTetgenFiles.py

about:
  home: http://proteustoolkit.org
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: Proteus is a Python package for rapidly developing computer models and numerical methods.
  dev_url: https://github.com/erdc/proteus

extra:
  recipe-maintainers:
    - davidbrochart
    - SylvainCorlay
    - martinRenou
    - zhang-alvin
    - jan-janssen
    - cekees
