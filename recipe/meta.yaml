{% set name = "proteus" %}
{% set version = "1.9.0" %}
{% set build = 0 %}
{% set sha256 = "51e5e1b7963c0b76f39be45f9193ab406a9d46bf6276559f142bd5f43b23f2c0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: proteus-{{ version }}.tar.gz
  url: https://github.com/erdc/proteus/archive/{{ version }}.tar.gz
  sha256: {{ sha256 }}
  # No patches needed: 1.9.0 carries the arm64 -mavx guard, the xtensor
  # subdirectory include paths and -std=c++20 upstream.

build:
  number: {{ build }}
  skip: true  # [win]
  {% set mpi_prefix = "mpi_" + mpi %}
  string: {{ mpi_prefix }}_h{{ PKG_HASH }}_{{ build }}
  run_exports:
    - {{ name }} * {{ mpi_prefix }}_*

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - make
    # Needed for cross-compiled builds (osx-arm64 built from an osx-64
    # host): without a build-platform python + cross-python's sysconfig
    # shim, there is no usable "python"/"$PYTHON" to run setup.py at all
    # -- $PREFIX/bin/python is a real arm64 binary that can't execute on
    # the x86_64 build machine ("Bad CPU type in executable"). See
    # h5py-feedstock's recipe for the same pattern.
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3                             # [build_platform != target_platform]
    - numpy >=1.25.1                         # [build_platform != target_platform]
  host:
    - setuptools
    - cython >=3
    - pybind11
    - pip
    - metis
    - {{ mpi }}
    - numpy >=1.25.1
    # Unpinned "openblas" lets the solver satisfy it with the ancient
    # 0.3.4 ABI-compatibility-shim build conda-forge keeps around for its
    # generic libblas/liblapack dispatch layer -- that build doesn't
    # actually use the libgfortran5 run_exports pulls in, so anything
    # linking it (proteus's superluWrappers extension, in particular)
    # fails at import time with "libgfortran.so.3: cannot open shared
    # object file" since only libgfortran.so.5 is provided. A lower
    # bound is enough to keep the solver on a real, current build.
    - openblas >=0.3.20
    - parmetis
    - petsc4py
    - petsc
    # real_*, not complex_*: proteus's C++ is built with -DPETSC_SKIP_COMPLEX
    # and assumes real PETSC_SCALAR throughout. Without this filter the
    # solver is free to pick either scalar variant. Kept as a separate entry
    # (like hdf5's mpi_prefix filter below) rather than replacing the bare
    # "petsc" line above, since conda-build's variant-based version pinning
    # (from conda_build_config.yaml) is only applied to a literal bare
    # package name in the recipe text.
    #
    # petsc4py itself has no equivalent "real_*"/"complex_*" build string
    # (its own recipe.yaml has no `build.string` override, just a generic
    # hash) -- it's already correctly filtered indirectly, since its own
    # host requirement is `petsc ${version_xy}.* ${scalar}_*`, so once
    # petsc itself is pinned to real_* here, any petsc4py built against
    # complex petsc becomes unsatisfiable on its own.
    - petsc * real_*
    - python
    # 1.9.0 is ported to the PCU_t handle API (PCU_C.h), added in scorec 4.
    - scorec >=4.2.1
    - triangle
    - superlu
    - superlu_dist
    # 1.9.0 uses the chrono 10 accumulator API (GetAccumulatedForce(i)).
    - pychrono >=10
    - mpi4py
    # 1.9.0 includes <xtensor/io/xio.hpp> -- the subdirectory layout
    # introduced in 0.26.
    - xtensor >=0.27.1,<0.28.0a0
    - xtensor-python
    - eigen
    # pinning from conda_build_config and build pinning from {{ mpi_prefix }}
    - hdf5
    - hdf5 * {{ mpi_prefix }}_*
  run:
    - mpi4py
    - scipy
    - tetgen
    - triangle
    - ncurses
    - pychrono >=10
    - scorec >=4.2.1
    - python 3
    - {{ pin_compatible('openblas', max_pin='x.x') }}
    - {{ pin_compatible('petsc4py', max_pin='x.x') }}
    - {{ pin_compatible('cython', max_pin='x.x') }}
    # pinning from conda_build_config and build pinning from {{ mpi_prefix }}
    - hdf5
    - hdf5 * {{ mpi_prefix }}_*
    - h5py
    - h5py * {{ mpi_prefix }}_*
test:
  imports:
    - proteus
  source_files:
    - test
  requires:
    - pytest
    - pytest-forked
    - matplotlib-base
  commands:
    - pytest -v test/ci/test_meshPartitionFromTetgenFiles.py

about:
  home: http://proteustoolkit.org
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: Proteus is a Python package for rapidly developing computer models and numerical methods.
  dev_url: https://github.com/erdc/proteus

extra:
  recipe-maintainers:
    - davidbrochart
    - SylvainCorlay
    - martinRenou
    - zhang-alvin
    - jan-janssen
    - cekees
